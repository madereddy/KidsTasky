# Komodo Resource Configuration for KidsTasky
# This file defines the stack for Komodo (komo.do) and manages resources via Resource Sync.

[[stack]]
name = "kidstasky"
description = "KidsTasky Full Stack"

[stack.config]
server = "Venus"
linked_repo = "venus"
branch = "main"
file_paths = ["stacks/kidstasky/compose.yaml"]
auto_update = true

# Environment variables injected by Komodo
# Values like [[JWT_SECRET]] refer to Komodo Variables
environment = """
NODE_ENV=production
HOST=0.0.0.0
PORT=3000
ALLOWED_ORIGINS=https://kids.madereddy.com
TRUST_PROXY_HOPS=1
ENFORCE_HTTPS=true
JSON_BODY_LIMIT=1mb
DB_PATH=/data/database.db
PHOTOS_UPLOADS_DIR=/data/uploads/photos
JWT_SECRET=[[JWT_SECRET]]
SECRET_KEY=[[SECRET_KEY]]
GEMINI_API_KEY=[[GEMINI_API_KEY]]
GOOGLE_CLIENT_ID=[[GOOGLE_CLIENT_ID]]
GOOGLE_CLIENT_SECRET=[[GOOGLE_CLIENT_SECRET]]
GOOGLE_REDIRECT_URI=https://kids.madereddy.com/api/sync/callback/google
MAILGUN_SIGNING_KEY=[[MAILGUN_SIGNING_KEY]]
"""
