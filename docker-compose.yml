services:
  webapp:
    image: ghcr.io/madereddy/kidstasky:latest
    pull_policy: always
    container_name: kidtasker
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://kids.madereddy.com}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-true}
      - JSON_BODY_LIMIT=${JSON_BODY_LIMIT:-1mb}
      - DB_PATH=/data/database.db
      - PHOTOS_UPLOADS_DIR=/data/uploads/photos
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://kids.madereddy.com/api/sync/callback/google}
      - MAILGUN_SIGNING_KEY=${MAILGUN_SIGNING_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:admin@madereddy.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - kidtasky_data:/data
    restart: unless-stopped

volumes:
  kidtasky_data:
    name: kidtasky_sqlite_data
