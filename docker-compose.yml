version: '3.8'

services:
  webapp:
    build: 
      context: .
      dockerfile: Dockerfile
    image: kidtasker:latest
    container_name: kidtasker_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/database.db
    volumes:
      - kidtasker_data:/data
    restart: unless-stopped

volumes:
  kidtasker_data:
    name: kidtasker_sqlite_data
